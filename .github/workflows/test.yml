name: SweepAtlas tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install packages
        run: python -m pip install opencv-python numpy
      - name: Compile Python files
        run: python -m compileall -q SweepAtlas.py SweepAtlasVideo.py tests
      - name: Test video reading and timeline
        run: python -m unittest discover -s tests -v
      - name: Test original planar alignment
        run: python SweepAtlas.py --self-test
